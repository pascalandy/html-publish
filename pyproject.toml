[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "html-publish"
version = "0.1.0"
description = "Private static page publishing with stable URLs and local Git history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py==4.2.0",
]

[project.scripts]
html-publish = "html_publish.cli:entrypoint"
html-publish-deploy = "html_publish.deploy:main"
html-publish-remote = "html_publish.remote:main"
html-publish-server = "html_publish.server:main"

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "ruff>=0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["html_publish"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["html_publish", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
